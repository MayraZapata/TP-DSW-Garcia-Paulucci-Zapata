<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Historial Clínico</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .buscador-box { background: #f4f4f4; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
    th { background-color: #f2f2f2; }
    .modal {
      display: none; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%; background: rgba(0,0,0,0.5);
      justify-content: center; align-items: center;
    }
    .modal-contenido {
      background: white; padding: 20px; border-radius: 8px;
      max-width: 500px; width: 90%; position: relative;
    }
    .cerrar-modal {
      position: absolute; top: 10px; right: 15px;
      cursor: pointer; font-size: 20px; font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Historial Clínico</h2>

  <!-- Caja de Búsqueda por DNI -->
  <div class="buscador-box" id="seccionBuscador">
    <label for="inputDni"><strong>DNI Paciente:</strong></label>
    <input type="text" id="inputDni" placeholder="Ingrese DNI del paciente">
    <button id="btnBuscarDni" onclick="buscarPorDni()">Buscar Historial</button>
  </div>

  <!-- Información del Paciente Seleccionado -->
  <div id="infoPaciente" style="margin-bottom: 15px; font-weight: bold; color: #333;"></div>

  <table>
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Hora</th>
        <th>Médico</th>
        <th>Especialidad</th>
        <th>Estado</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody id="tablaHistorial">
      <tr><td colspan="6" style="text-align:center;">Ingrese un DNI de paciente para consultar.</td></tr>
    </tbody>
  </table>

  <br>
  <button onclick="location.href='menu.html'">Volver al Menú</button>

  <!-- Modal Detalle Diagnóstico -->
  <div id="modalDiagnostico" class="modal">
    <div class="modal-contenido">
      <span class="cerrar-modal" onclick="cerrarModal()">&times;</span>
      <h3>Detalle del Diagnóstico</h3>
      <p><strong>Fecha:</strong> <span id="diagFecha"></span></p>
      <p><strong>Médico:</strong> <span id="diagMedico"></span></p>
      <p><strong>Diagnóstico:</strong> <span id="diagNombre"></span></p>
      <p><strong>Tratamiento / Indicaciones:</strong></p>
      <div id="diagTratamiento" style="background: #f9f9f9; padding: 10px; border: 1px solid #eee;"></div>
    </div>
  </div>

  <script src="js/historial-clinico.js"></script>
</body>
</html>
